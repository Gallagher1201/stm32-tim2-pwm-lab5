/* Observers only: these signals never drive PA0 or change timer registers. */
signal void lab_check(void) {
    unsigned long i;
    swatch(0.010);
    printf("CONFIG mode=%u SYSCLK=%u PSC=%u ARR=%u CRL=0x%X CCMR1=0x%X CCER=0x%X\n", demo_pwm, SystemCoreClock, TIM2_PSC, TIM2_ARR, GPIOA_CRL, TIM2_CCMR1, TIM2_CCER);
    for (i=0; i<9; i++) {
        printf("SAMPLE t=%f ms=%u irq=%u LED=%u CCR=%u phase=%u cycles=%u PA0=%u\n", states/72000000.0, elapsed_ms, irq_count, led_state, TIM2_CCR1, phase_step, breath_cycles, PORTA & 1);
        swatch(0.5);
    }
    _break_ = 1;
}

/* pwm_reference is sampled by firmware from CNT and CCR1; not PA0 feedback. */
